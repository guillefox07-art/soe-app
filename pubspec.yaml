name: soe_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.3
  pdf: ^3.13.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  excel: ^4.0.6
  ota_update: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icono_app.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icono_app.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/

dependency_overrides:
  xml: ^7.0.1